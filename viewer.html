<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Viewer | kavakci.dev</title>
    <meta
      name="description"
      content="View statistics notes and lecture images."
    />
    <meta property="og:title" content="Image Viewer | Statistics" />
    <meta property="og:type" content="article" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/hack/0.8.1/hack.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/hack/0.8.1/dark.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <script src="viewer.js" defer></script>
  </head>
  <body class="hack dark">
    <div class="container">
      <header>
        <h1 id="image-title">Loading...</h1>
        <p><a id="image-path" class="lead" download></a></p>
        <div>
          <a href="index.html" class="btn btn-default btn-ghost"
            >&lt; Back to Notes</a
          >
        </div>
      </header>

      <div id="openseadragon-viewer"></div>

      <div>
        <button id="zoom-in" class="btn btn-primary btn-ghost">Zoom In</button>
        <button id="zoom-out" class="btn btn-primary btn-ghost">
          Zoom Out
        </button>
        <button id="home" class="btn btn-default btn-ghost">Reset</button>
        <button id="full-page" class="btn btn-default btn-ghost">
          Full Page
        </button>
      </div>

      <hr />
      <footer>
        <p>
          &copy; 2026 <a href="https://kavakci.dev">kavakci.dev</a> |
          <a href="https://github.com/dybdeskarphet/statistics">source code</a>
        </p>
      </footer>

        </p>
      </footer>
    </div>
  </body>
</html>
